<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#11110f">
    <title>NOIR COFFEE | Dijital Menü</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QRCode.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        noir: {
                            bg: '#0F0F0D',
                            card: '#181816',
                            border: '#2A2A26',
                            gold: '#D4AF37',
                            'gold-hover': '#B89628',
                            muted: '#8E8E8A',
                            light: '#F4F4F2'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0F0F0D; color: #F4F4F2; font-family: 'Plus Jakarta Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-24 antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-[#0F0F0D]/90 backdrop-blur-md border-b border-noir-border px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <a href="#" class="font-serif text-2xl font-bold tracking-wider text-white">NOIR<span class="text-noir-gold">.</span></a>
            <span id="tableBadge" class="text-[10px] tracking-widest text-noir-gold border border-noir-gold/40 px-2.5 py-0.5 rounded-full uppercase font-semibold">Masa 01</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="openQRModal()" class="flex items-center gap-1.5 bg-noir-card border border-noir-gold/40 text-noir-gold px-3 py-1.5 rounded-full text-xs font-medium hover:bg-noir-gold hover:text-black transition-all">
                <i data-lucide="qr-code" class="w-4 h-4"></i>
                <span>Masa QR</span>
            </button>
            <button onclick="callWaiter()" class="bg-noir-card border border-noir-border text-noir-light p-2 rounded-full hover:border-noir-gold transition" title="Garson Çağır">
                <i data-lucide="bell" class="w-4 h-4 text-noir-gold"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4 pt-4">
        <section class="relative rounded-2xl overflow-hidden mb-6 border border-noir-border bg-noir-card">
            <img src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?auto=format&fit=crop&w=800&q=80" alt="Hero Kahve" class="w-full h-44 object-cover opacity-60">
            <div class="absolute inset-0 bg-gradient-to-t from-noir-card via-transparent to-transparent"></div>
            <div class="absolute bottom-3 left-4 right-4">
                <span class="text-[10px] tracking-widest text-noir-gold uppercase font-semibold">KAHVE BİR RİTÜELDİR</span>
                <h1 class="text-xl font-serif font-bold text-white mt-0.5">Her yudumda <span class="italic text-noir-gold">bir hikâye.</span></h1>
            </div>
        </section>

        <div class="relative mb-4">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-noir-muted"></i>
            <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Ürün veya içerik ara..." class="w-full bg-noir-card border border-noir-border rounded-xl pl-9 pr-4 py-2.5 text-sm text-noir-light placeholder-noir-muted focus:outline-none focus:border-noir-gold">
        </div>

        <div class="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pb-1">
            <button onclick="setCategory('all')" class="category-btn active bg-noir-gold text-black font-semibold text-xs px-4 py-2 rounded-full whitespace-nowrap transition">Tümü</button>
            <button onclick="setCategory('hot')" class="category-btn bg-noir-card border border-noir-border text-noir-muted text-xs px-4 py-2 rounded-full whitespace-nowrap transition hover:text-white">Sıcak Kahveler</button>
            <button onclick="setCategory('cold')" class="category-btn bg-noir-card border border-noir-border text-noir-muted text-xs px-4 py-2 rounded-full whitespace-nowrap transition hover:text-white">Soğuk Kahveler</button>
            <button onclick="setCategory('dessert')" class="category-btn bg-noir-card border border-noir-border text-noir-muted text-xs px-4 py-2 rounded-full whitespace-nowrap transition hover:text-white">Tatlılar</button>
            <button onclick="setCategory('bakery')" class="category-btn bg-noir-card border border-noir-border text-noir-muted text-xs px-4 py-2 rounded-full whitespace-nowrap transition hover:text-white">Atıştırmalıklar</button>
        </div>

        <div id="productList" class="space-y-3"></div>
    </main>

    <!-- Sepet Barı -->
    <div id="cartBar" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-noir-gold text-black rounded-2xl p-3 shadow-xl flex items-center justify-between hidden z-30">
        <div class="flex items-center gap-3 pl-2">
            <div class="bg-black/10 p-2 rounded-xl">
                <i data-lucide="shopping-bag" class="w-5 h-5 text-black"></i>
            </div>
            <div>
                <p id="cartCountText" class="text-xs font-bold leading-none">0 Ürün Seçildi</p>
                <p id="cartTotalText" class="text-sm font-extrabold mt-0.5">₺0</p>
            </div>
        </div>
        <button onclick="sendOrder()" class="bg-black text-white text-xs font-bold px-4 py-2.5 rounded-xl hover:bg-neutral-800 transition">Siparişi Tamamla</button>
    </div>

    <!-- QR Kod Modal -->
    <div id="qrModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-noir-card border border-noir-border rounded-2xl max-w-sm w-full p-5 text-center relative">
            <button onclick="closeQRModal()" class="absolute top-4 right-4 text-noir-muted hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="font-serif text-lg font-bold text-white mb-1">Masa QR Kodu</h3>
            <p class="text-xs text-noir-muted mb-4">Masalara özel QR kod oluşturun ve indirin.</p>
            <div class="mb-4">
                <label class="text-xs text-noir-muted block mb-1 text-left">Masa Numarası Seçin:</label>
                <select id="tableSelect" onchange="generateQRCode()" class="w-full bg-noir-bg border border-noir-border text-white rounded-xl p-2.5 text-sm focus:outline-none focus:border-noir-gold">
                    <option value="1">Masa 01</option>
                    <option value="2">Masa 02</option>
                    <option value="3">Masa 03</option>
                    <option value="4">Masa 04</option>
                    <option value="5">Masa 05</option>
                </select>
            </div>
            <div class="bg-white p-4 rounded-xl inline-block mb-4 shadow-inner" id="qrcode"></div>
            <button onclick="downloadQR()" class="w-full bg-noir-gold text-black font-semibold text-xs py-2.5 rounded-xl flex items-center justify-center gap-2">
                <i data-lucide="download" class="w-4 h-4"></i> QR Kodu İndir (PNG)
            </button>
        </div>
    </div>

    <!-- Firebase SDK v9 / v10 Uyumlu Entegrasyon -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD-Bn2ZUKXr0El0j1_PB6rds7aA01E_ftg",
            authDomain: "qrkodlumenu.firebaseapp.com",
            databaseURL: "https://qrkodlumenu-default-rtdb.firebaseio.com",
            projectId: "qrkodlumenu",
            storageBucket: "qrkodlumenu.appspot.com",
            messagingSenderId: "33662917148",
            appId: "1:33662917148:web:93f4786e9892665f121dd9",
            measurementId: "G-JFQZGK75FT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // URL'den Masa Numarası Okuma (Örn: ?table=3)
        const urlParams = new URLSearchParams(window.location.search);
        const tableNumber = urlParams.get('table') || '1';
        document.getElementById('tableBadge').innerText = `Masa ${tableNumber.padStart(2, '0')}`;

        const products = [
            { id: 1, name: "Cappuccino", category: "hot", price: 120, desc: "Espresso, sıcak süt ve yoğun süt köpüğü.", img: "https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?auto=format&fit=crop&w=600&q=80" },
            { id: 2, name: "Iced Spanish Latte", category: "cold", price: 160, desc: "Espresso, soğuk süt ve yoğunlaştırılmış tatlı süt.", img: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=600&q=80" },
            { id: 3, name: "Espresso Single", category: "hot", price: 90, desc: "Yoğun aromalı, sert karakterli tek shot espresso.", img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=600&q=80" },
            { id: 4, name: "San Sebastian Cheesecake", category: "dessert", price: 180, desc: "Karamelize üst doku, akışkan nefis iç kıvam.", img: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80" },
            { id: 5, name: "Belçika Çikolatalı Brownie", category: "dessert", price: 140, desc: "Sıcak servis edilen yoğun çikolatalı ıslak brownie.", img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=600&q=80" },
            { id: 6, name: "Iced Americano", category: "cold", price: 110, desc: "Buzlu soğuk su üzerinde çift shot espresso.", img: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=600&q=80" },
            { id: 7, name: "Fransız Tereyağlı Kruvasan", category: "bakery", price: 95, desc: "Taze pişmiş, kat kat çıtır orijinal tereyağlı kruvasan.", img: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=600&q=80" }
        ];

        let currentCategory = 'all';
        let cart = {};

        function renderProducts() {
            const list = document.getElementById('productList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = products.filter(p => {
                const matchCat = currentCategory === 'all' || p.category === currentCategory;
                const matchSearch = p.name.toLowerCase().includes(search) || p.desc.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                list.innerHTML = `<p class="text-center text-noir-muted text-xs py-8">Aradığınız kriterlere uygun ürün bulunamadı.</p>`;
                return;
            }

            list.innerHTML = filtered.map(p => `
                <div class="bg-noir-card border border-noir-border rounded-2xl p-3 flex gap-3 items-center">
                    <img src="${p.img}" alt="${p.name}" class="w-20 h-20 rounded-xl object-cover flex-shrink-0">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-semibold text-sm text-white truncate">${p.name}</h4>
                        <p class="text-[11px] text-noir-muted line-clamp-2 mt-0.5">${p.desc}</p>
                        <p class="text-noir-gold font-bold text-sm mt-1">₺${p.price}</p>
                    </div>
                    <button onclick="window.addToCart(${p.id})" class="bg-noir-bg border border-noir-border text-noir-gold p-2.5 rounded-xl hover:bg-noir-gold hover:text-black transition flex-shrink-0">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.setCategory = function(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-noir-gold', 'text-black', 'font-semibold');
                btn.classList.add('bg-noir-card', 'border', 'border-noir-border', 'text-noir-muted');
            });
            event.target.classList.remove('bg-noir-card', 'border', 'border-noir-border', 'text-noir-muted');
            event.target.classList.add('bg-noir-gold', 'text-black', 'font-semibold');
            renderProducts();
        }

        window.filterProducts = function() { renderProducts(); }

        window.addToCart = function(id) {
            cart[id] = (cart[id] || 0) + 1;
            updateCartBar();
        }

        function updateCartBar() {
            const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
            const totalPrice = Object.entries(cart).reduce((total, [id, qty]) => {
                const item = products.find(p => p.id === parseInt(id));
                return total + (item ? item.price * qty : 0);
            }, 0);

            const cartBar = document.getElementById('cartBar');
            if (totalCount > 0) {
                cartBar.classList.remove('hidden');
                document.getElementById('cartCountText').innerText = `${totalCount} Adet Ürün Seçildi`;
                document.getElementById('cartTotalText').innerText = `₺${totalPrice}`;
            } else {
                cartBar.classList.add('hidden');
            }
        }

        window.sendOrder = async function() {
            if (Object.keys(cart).length === 0) return;

            const orderItems = Object.entries(cart).map(([id, qty]) => {
                const item = products.find(p => p.id === parseInt(id));
                return { name: item.name, price: item.price, quantity: qty };
            });

            const totalPrice = orderItems.reduce((acc, curr) => acc + (curr.price * curr.quantity), 0);

            const orderData = {
                table: tableNumber,
                type: 'order',
                items: orderItems,
                total: totalPrice,
                time: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
                status: 'pending'
            };

            try {
                await push(ref(db, 'orders'), orderData);
                alert("Siparişiniz masanıza iletildi! Afiyet olsun.");
                cart = {};
                updateCartBar();
            } catch (error) {
                alert("Sipariş gönderilirken bir hata oluştu!");
                console.error(error);
            }
        }

        window.callWaiter = async function() {
            const callData = {
                table: tableNumber,
                type: 'waiter_call',
                time: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
                status: 'pending'
            };
            try {
                await push(ref(db, 'orders'), callData);
                alert(`Masa ${tableNumber} için garson çağrıldı! Bekleyiniz.`);
            } catch (error) {
                alert("Garson çağrılamadı!");
            }
        }

        // QR Modal
        let qrcodeObj = null;
        window.openQRModal = function() {
            document.getElementById('qrModal').classList.remove('hidden');
            generateQRCode();
        }
        window.closeQRModal = function() { document.getElementById('qrModal').classList.add('hidden'); }
        
        window.generateQRCode = function() {
            const tableNum = document.getElementById('tableSelect').value;
            const currentUrl = window.location.href.split('?')[0] + `?table=${tableNum}`;
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            qrcodeObj = new QRCode(qrContainer, {
                text: currentUrl, width: 160, height: 160, colorDark: "#0F0F0D", colorLight: "#ffffff"
            });
        }
        window.downloadQR = function() {
            const img = document.querySelector('#qrcode img');
            if (img && img.src) {
                const link = document.createElement('a');
                link.href = img.src;
                link.download = `Noir-Coffee-Masa-${document.getElementById('tableSelect').value}-QR.png`;
                link.click();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            lucide.createIcons();
        });
    </script>
</body>
</html>
